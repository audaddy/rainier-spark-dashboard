        - generic [ref=f14e1269]:
          - generic [ref=f14e1270]: Bio
          - paragraph [ref=f14e1271]: Major Christopher "Radio" Williston is the Chief of Innovations and Human Performance for Rainier Spark at the 62d Airlift Wing, Joint Base Lewis-McChord, Wash. He leads the Rainier Spark innovation portfolio across all 62d AW lines of effort — driving the Human Performance wearables rollout, Spark Lab modernization, and biometric-enabled crew-rest policy from concept through wing-wide execution. He also serves as a C-17A Evaluator Aircraft Commander, leading wing-level innovation and human performance initiatives. Major Williston commissioned from Officer Training School in August 2012. He served as a B-1B Weapon Systems Officer at Ellsworth AFB, S.D., deploying in support of Operations Inherent Resolve and Enduring Freedom, amassing 889 combat hours. In 2016, he entered pilot training, graduating as a Distinguished Graduate from Specialized Undergraduate Pilot Training at Vance AFB, Okla. Prior to his current assignment, Major Williston was assigned to Travis AFB, Calif., as Deputy Chief of Phoenix Spark, C-17A Tactics Flight Commander, and Deputy Director for the "Wings Over Solano" Airshow. Most recently, he was Chief of Wing Plans and Programs for the 62d Airlift Wing.
          - button "Read full bio" [ref=f14e1272] [cursor=pointer]
