<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rainier Spark Badge</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 8px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #0f1318 0%, #1c2027 100%);
    border: 1px solid rgba(168,196,230,0.35);
    border-radius: 6px;
    padding: 14px 22px 14px 14px;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(168,196,230,0.1);
  }
  .badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(168,196,230,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .badge::after {
    content: '';
    position: absolute;
    top: 5px; left: 5px;
    width: 10px; height: 10px;
    border-top: 1.5px solid rgba(168,196,230,0.6);
    border-left: 1.5px solid rgba(168,196,230,0.6);
    pointer-events: none;
  }
  .badge:hover {
    border-color: rgba(168,196,230,0.7);
    box-shadow: 0 6px 32px rgba(168,196,230,0.15), inset 0 1px 0 rgba(168,196,230,0.2);
    transform: translateY(-1px);
  }
  .badge:hover .arrow { transform: translateX(4px); }
  .logo-wrap {
    position: relative;
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1.5px solid rgba(168,196,230,0.45);
    box-shadow: 0 0 14px rgba(168,196,230,0.18);
    overflow: hidden;
    background: #000;
  }
  .logo-bg {
    position: absolute;
    inset: 0;
    background-image: url('img/crest-badge.jpg');
    background-repeat: no-repeat;
    background-size: 133px auto;
    background-position: 46% center;
  }
  .logo-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed rgba(168,196,230,0.3);
    opacity: 0;
    animation: spin 8s linear infinite;
    transition: opacity 0.2s;
  }
  .badge:hover .logo-ring { opacity: 1; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .text-block { display: flex; flex-direction: column; gap: 3px; }
  .eyebrow {
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #a8c4e6;
    font-weight: 600;
  }
  .title {
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .sub {
    font-size: 10px;
    color: rgba(184,190,199,0.7);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .arrow {
    margin-left: 8px;
    color: #a8c4e6;
    font-size: 18px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .live-dot {
    width: 7px;
    height: 7px;
    background: #6fb47a;
    border-radius: 50%;
    box-shadow: 0 0 6px #6fb47a;
    animation: pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  /* The dashboard honours this in nine places; the badge ran both of its
     infinite animations regardless of the OS setting. */
  @media (prefers-reduced-motion: reduce) {
    .logo-ring { animation: none; }
    .live-dot { animation: none; }
    .badge, .badge:hover, .arrow { transition: none; }
    .badge:hover { transform: none; }
    .badge:hover .arrow { transform: none; }
  }
  .divider {
    width: 1px;
    height: 40px;
    background: rgba(168,196,230,0.18);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <!-- This is an embeddable widget, but it is also directly reachable at a public
       URL, so it has to stand up as a document on its own: a main landmark and a
       real h1. Both are class-styled, so the rendering is unchanged. -->
  <main>
    <a class="badge" href="https://audaddy.github.io/rainier-spark-dashboard/" target="_blank" rel="noopener">
      <div class="logo-wrap">
        <div class="logo-bg" role="img" aria-label="Rainier Spark crest"></div>
        <div class="logo-ring" aria-hidden="true"></div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="text-block">
        <span class="eyebrow">62d Airlift Wing · McChord AFB</span>
        <h1 class="title">Rainier Spark</h1>
        <span class="sub">Innovation Dashboard · Q2 FY26</span>
      </div>
      <div class="live-dot" aria-hidden="true"></div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>
</body>
</html>
