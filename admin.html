<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rainier Spark · Admin Metrics</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; --accent:#1a8cff; --accent-soft:#6fb0ff; --bg:#0b0d11; --panel:#12151b; --line:rgba(255,255,255,.08); --muted:#7c8794; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #e6ecf2;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 24px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: #9aa6b2; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  input { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,.15); color: #e6ecf2;
    border-radius: 5px; padding: 9px 11px; font: inherit; }
  .row { display: flex; gap: 8px; }
  button { background: var(--accent); color: #06121f; border: 0; border-radius: 5px; padding: 9px 16px;
    font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
  button.ghost { background: transparent; color: #9aa6b2; border: 1px solid rgba(255,255,255,.15); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: #cbd5e1; }
  th .arrow { color: var(--accent-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .big { color: var(--accent-soft); font-weight: 700; }
  .muted { color: var(--muted); }
  .err { color: #ff6b6b; font-size: 13px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 4px; }
  a { color: var(--accent-soft); }

  /* KPI tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .tile .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
  .tile .v { font-size: 26px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; margin-top: 4px; line-height: 1; }
  .tile .d { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .tile .v.accent { color: var(--accent-soft); }

  .chead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .chead h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: #cbd5e1; }
  .chead .legend { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .barwrap { width: 100%; overflow-x: auto; }
  .spark { display: block; }
  .actioncell b { color: #e6ecf2; font-weight: 600; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Rainier Spark · Metrics</h1>
  <div class="sub">Button &amp; link clicks · admin only</div>

  <div class="card">
    <label for="key">Admin key</label>
    <div class="row">
      <!-- current-password, not off: autocomplete="off" blocks password managers,
           which fails WCAG 3.3.8 and pushes people toward pasting the key from a
           note instead of storing it properly. -->
      <input id="key" type="password" placeholder="Paste your admin key" autocomplete="current-password" />
      <button id="load">Load</button>
      <button id="refresh" class="ghost" title="Reload data">Refresh</button>
      <button id="forget" class="ghost" title="Clear saved key">Forget</button>
    </div>
    <div id="err" class="err" style="display:none"></div>
    <div class="note">Traffic (visitors, page views, referrers, countries) lives in your
      <a href="https://dash.cloudflare.com/?to=/:account/web-analytics" target="_blank" rel="noopener">Cloudflare Web Analytics</a>
      dashboard. This page shows the button/link clicks tracked through your Worker.</div>
  </div>

  <div id="results"></div>
</main>

<script>
  const LB_API = 'https://rainier-spark-leaderboard.audaddy.workers.dev';
  const CHART_DAYS = 30;   // site-wide activity window
  const SPARK_DAYS = 14;   // per-action sparkline window
  const LABELS = {
    wordle_open: 'Wordle opened', zip_open: 'Zip opened', snake_open: 'Snake opened',
    visit: 'Page visit', konami_open: 'Konami controller', palette_open: 'Command palette',
    push_optin: 'Push opt-in', streak_nudge: 'Streak nudge', streak_optin: 'Streak opt-in',
    share_sparkle: 'Share · Wordle', share_zip: 'Share · Zip', share_snake: 'Share · Snake', team: 'Team',
    location_hours: 'Location / Hours', email_orgbox: 'Email Org Box', instagram: 'Instagram',
    map: 'Google Maps', vision_open: 'Vision card opened',
    // filter tabs
    filter_all: 'Filter · All Lines of Effort', filter_priority: 'Filter · High Priority',
    filter_suas: 'Filter · sUAS / C-sUAS', filter_hpt: 'Filter · Human Performance',
    filter_infra: 'Filter · Lab / Infrastructure', filter_am: 'Filter · Additive Manufacturing',
    filter_spouse: 'Filter · Spouse Employment', filter_vision: 'Filter · Vision (SIF26)',
    // individual innovation-line cards
    card_c17_suas: 'Card · C-17 sUAS Inspections', card_hpt_wearables: 'Card · HPT Wearables Rollout',
    card_lab_infra: 'Card · Lab Modernization', card_additive_mfg: 'Card · Additive Mfg Cell',
    card_hand_built_drones: 'Card · Hand-Built Drones', card_mindgym: 'Card · MindGym',
    card_beast_running: 'Card · Rainier Runners', card_medicmind: 'Card · MedicMind',
    card_go_fish: 'Card · Go FiSH',
  };
  // Fallback so any new card/filter still reads cleanly without a code change
  function pretty(name) {
    if (LABELS[name]) return LABELS[name];
    const m = name.match(/^(card|filter|vision)_(.+)$/);
    if (m) {
      const kind = { card: 'Card', filter: 'Filter', vision: 'Vision' }[m[1]];
      return kind + ' · ' + m[2].replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    }
    return name;
  }
  function category(name) {
    if (/^(wordle|zip|snake|konami)_/.test(name)) return 'Games';
    if (name === 'palette_open') return 'Navigation';
    if (name.startsWith('filter_')) return 'Filters';
    if (name.startsWith('card_')) return 'Cards';
    if (name.startsWith('vision')) return 'Vision';
    return 'Connect';
  }

  const keyInput = document.getElementById('key');
  const err = document.getElementById('err');
  const results = document.getElementById('results');
  let lastEvents = null;        // cache for re-sorts without refetch
  let lastPeople = null;        // unique-visitor aggregates (null on old Worker)
  let sortKey = 'total';        // total | last7 | today | people | name
  let sortDir = -1;             // -1 desc, 1 asc

  const saved = localStorage.getItem('rs-admin-key');
  if (saved) { keyInput.value = saved; load(); }

  function utcDay(offset = 0) {
    const d = new Date(); d.setUTCDate(d.getUTCDate() - offset);
    return d.toISOString().slice(0, 10);
  }
  // Ordered list of the last n UTC dates (oldest -> newest).
  function lastNDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(utcDay(i));
    return out;
  }
  function windowTotal(days, n) {
    let t = 0;
    for (let i = 0; i < n; i++) t += days[utcDay(i)] || 0;
    return t;
  }
  function showErr(msg) { err.style.display = 'block'; err.textContent = msg; }

  async function load() {
    err.style.display = 'none';
    const key = keyInput.value.trim();
    if (!key) { showErr('Enter your admin key.'); return; }
    let res;
    try {
      res = await fetch(`${LB_API}/stats`, { headers: { 'X-Admin-Key': key } });
    } catch (e) { showErr('Network error reaching the Worker.'); return; }
    if (res.status === 401) { showErr('Wrong admin key (or ADMIN_KEY not set on the Worker).'); return; }
    if (!res.ok) { showErr('Unexpected error: ' + res.status); return; }
    localStorage.setItem('rs-admin-key', key);
    const { events, people } = await res.json();
    lastEvents = events || {};
    lastPeople = people || null;
    render();
  }

  // ── Inline SVG charts (no dependencies) ──
  function barChart(dates, values) {
    const W = 920, H = 150, padB = 22, padT = 10, padL = 4, padR = 4;
    const max = Math.max(1, ...values);
    const n = values.length;
    const gap = 3;
    const bw = (W - padL - padR) / n - gap;
    const plotH = H - padB - padT;
    const today = utcDay(0);
    let bars = '', ticks = '';
    values.forEach((v, i) => {
      const x = padL + i * (bw + gap);
      const h = Math.round((v / max) * plotH);
      const y = padT + plotH - h;
      const isToday = dates[i] === today;
      bars += `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${h}" rx="1.5"
        fill="${isToday ? '#6fb0ff' : '#1a8cff'}" opacity="${v ? (isToday ? 1 : 0.85) : 0.18}">
        <title>${dates[i]} — ${v} click${v === 1 ? '' : 's'}</title></rect>`;
      // date tick every ~5 days and on the last bar
      if (i % 5 === 0 || i === n - 1) {
        ticks += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle"
          font-size="9" fill="#7c8794">${dates[i].slice(5)}</text>`;
      }
    });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Daily clicks, last ${n} days">
      <line x1="${padL}" y1="${padT + plotH + 0.5}" x2="${W - padR}" y2="${padT + plotH + 0.5}" stroke="rgba(255,255,255,.12)"/>
      ${bars}${ticks}</svg>`;
  }

  function sparkline(days) {
    const dates = lastNDays(SPARK_DAYS);
    const vals = dates.map((d) => days[d] || 0);
    const W = 108, H = 26, n = vals.length, gap = 1.5;
    const max = Math.max(1, ...vals);
    const bw = (W) / n - gap;
    let bars = '';
    vals.forEach((v, i) => {
      const h = Math.max(v ? 1 : 0, Math.round((v / max) * (H - 2)));
      bars += `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${H - h}" width="${bw.toFixed(1)}" height="${h}" rx="1"
        fill="#6fb0ff" opacity="${v ? 0.9 : 0.15}"><title>${dates[i].slice(5)}: ${v}</title></rect>`;
    });
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${bars}</svg>`;
  }

  function th(key, label, cls) {
    const active = sortKey === key;
    const arrow = active ? `<span class="arrow">${sortDir === -1 ? '↓' : '↑'}</span>` : '';
    return `<th class="sortable ${cls || ''}" data-sort="${key}">${label} ${arrow}</th>`;
  }

  function render() {
    const events = lastEvents || {};
    const names = Object.keys(events);
    if (!names.length) {
      results.innerHTML = '<div class="card muted">No clicks recorded yet. Once the site is live and people start tapping buttons, they\'ll show up here.</div>';
      return;
    }

    // ── Aggregate site-wide daily totals ──
    const dates = lastNDays(CHART_DAYS);
    const dayIndex = Object.create(null);
    dates.forEach((d) => (dayIndex[d] = 0));
    let allTime = 0;
    for (const n of names) {
      allTime += events[n].total || 0;
      const days = events[n].days || {};
      for (const d in days) if (d in dayIndex) dayIndex[d] += days[d];
    }
    const chartVals = dates.map((d) => dayIndex[d]);
    const today = utcDay(0);
    const last7 = names.reduce((s, n) => s + windowTotal(events[n].days || {}, 7), 0);
    const todayTotal = names.reduce((s, n) => s + ((events[n].days || {})[today] || 0), 0);
    const prev7 = names.reduce((s, n) => {
      const days = events[n].days || {};
      let t = 0; for (let i = 7; i < 14; i++) t += days[utcDay(i)] || 0; return s + t;
    }, 0);
    const wowDelta = prev7 === 0 ? (last7 ? '+∞' : '—') : (((last7 - prev7) / prev7) * 100).toFixed(0).replace(/^(?!-)/, '+') + '%';
    let peakDay = dates[0], peakVal = -1;
    dates.forEach((d) => { if (dayIndex[d] > peakVal) { peakVal = dayIndex[d]; peakDay = d; } });

    // ── Category breakdown ──
    const cats = {};
    for (const n of names) { const c = category(n); cats[c] = (cats[c] || 0) + (events[n].total || 0); }
    const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1])
      .map(([c, v]) => `${c} <b style="color:#e6ecf2">${v}</b>`).join(' &nbsp;·&nbsp; ');

    // ── KPI tiles ──
    const tiles = `<div class="tiles">
      <div class="tile"><div class="k">Total clicks</div><div class="v">${allTime}</div><div class="d">${names.length} actions tracked</div></div>
      <div class="tile"><div class="k">Last 7 days</div><div class="v accent">${last7}</div><div class="d">${wowDelta} vs prior 7</div></div>
      <div class="tile"><div class="k">Today (UTC)</div><div class="v">${todayTotal}</div><div class="d">${today}</div></div>
      <div class="tile"><div class="k">Busiest day</div><div class="v">${peakVal}</div><div class="d">${peakDay}</div></div>
    </div>`;

    // ── Site-wide activity chart ──
    const chart = `<div class="card">
      <div class="chead"><h2>Daily activity · last ${CHART_DAYS} days</h2><span class="legend">${catRows}</span></div>
      <div class="barwrap">${barChart(dates, chartVals)}</div>
    </div>`;

    // ── People: anonymous unique-visitor metrics ──
    const people = lastPeople;
    let peopleSection = '';
    if (people) {
      const uniqDaily = dates.map((d) => (people.daily && people.daily[d]) || 0);
      peopleSection = `<div class="tiles">
        <div class="tile"><div class="k">Unique visitors</div><div class="v" style="color:#a78bfa">${people.uniqueTotal}</div><div class="d">distinct browsers</div></div>
        <div class="tile"><div class="k">Active today</div><div class="v">${people.dauToday}</div><div class="d">${people.newToday} new · ${people.returningToday} returning</div></div>
        <div class="tile"><div class="k">Active last 7d</div><div class="v">${people.active7}</div><div class="d">unique people</div></div>
        <div class="tile"><div class="k">Clicks / person</div><div class="v">${people.avgClicksPerVisitor}</div><div class="d">avg engagement</div></div>
      </div>
      <div class="card">
        <div class="chead"><h2>Unique visitors · last ${CHART_DAYS} days</h2><span class="legend">distinct people per day</span></div>
        <div class="barwrap">${barChart(dates, uniqDaily)}</div>
      </div>`;
    } else {
      peopleSection = `<div class="card muted" style="font-size:12px">Unique-visitor metrics activate once the updated Worker is deployed (<code>wrangler deploy</code>). Click counts above are already live.</div>`;
    }

    // ── Per-action table (sortable) ──
    const rowData = names.map((n) => ({
      name: n, label: pretty(n), total: events[n].total || 0,
      last7: windowTotal(events[n].days || {}, 7), today: (events[n].days || {})[today] || 0,
      people: (people && people.perAction && people.perAction[n]) || 0,
      pclicks: (people && people.perActionClicks && people.perActionClicks[n]) || 0,
      days: events[n].days || {},
    }));
    rowData.sort((a, b) => {
      if (sortKey === 'name') return sortDir * a.label.localeCompare(b.label);
      return sortDir * ((a[sortKey] || 0) - (b[sortKey] || 0));
    });
    let rows = '';
    for (const r of rowData) {
      const ratio = r.people ? (r.pclicks / r.people).toFixed(1) : '—';
      rows += `<tr>
        <td class="actioncell"><b>${r.label}</b><div class="muted" style="font-size:10px">${r.name}</div></td>
        <td class="num big">${r.total}</td>
        <td class="num">${r.last7}</td>
        <td class="num">${r.today}</td>
        <td class="num" style="color:#a78bfa;font-weight:700">${people ? r.people : '—'}</td>
        <td class="num muted">${people ? ratio : '—'}</td>
        <td style="text-align:right">${sparkline(r.days)}</td>
      </tr>`;
    }
    const table = `<div class="card"><table>
      <thead><tr>
        ${th('name', 'Action')}
        ${th('total', 'All-time', 'num')}
        ${th('last7', 'Last 7d', 'num')}
        ${th('today', 'Today', 'num')}
        ${th('people', 'People', 'num')}
        <th class="num" title="Tracked clicks per unique person">×/person</th>
        <th class="num">${SPARK_DAYS}-day trend</th>
      </tr></thead>
      <tbody>${rows}</tbody></table></div>`;

    results.innerHTML = tiles + chart + peopleSection + table;

    // wire sortable headers
    results.querySelectorAll('th.sortable').forEach((el) => {
      el.addEventListener('click', () => {
        const k = el.dataset.sort;
        if (sortKey === k) { sortDir *= -1; }
        else { sortKey = k; sortDir = k === 'name' ? 1 : -1; }
        render();
      });
    });
  }

  document.getElementById('load').addEventListener('click', load);
  document.getElementById('refresh').addEventListener('click', load);
  keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
  document.getElementById('forget').addEventListener('click', () => {
    localStorage.removeItem('rs-admin-key'); keyInput.value = ''; results.innerHTML = ''; lastEvents = null;
  });
</script>
</body>
</html>
