<meta charset="utf-8" />

<title>Rainier Spark · 62d AW Innovation Dashboard</title>
<style>
:root {
  --ink-950: #050608;
  --ink-900: #0b0d11;
  --ink-800: #14171c;
  --ink-700: #1c2027;
  --line: rgba(216, 221, 228, 0.16);
  --line-strong: rgba(216, 221, 228, 0.32);
  --paper: #050608;
  --text: #ffffff;
  --af-silver-100: #ffffff;
  --af-silver-200: #d8dde4;
  --af-silver-300: #b8bec7;
  --af-silver-400: #969ca6;
  --af-silver-500: #5e636d;
  --af-cyan: #a8c4e6;
  --steel: #2c4a78;
  --priority: #e8794c;
  --amber: #e8b94a;
  --green: #6fb47a;
  --card-border: rgba(216, 221, 228, 0.16);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); }
body { visibility: visible !important; }

body {
  font-family: 'Barlow', system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 20% -10%, rgba(44, 74, 120, 0.18), transparent 60%),
    radial-gradient(ellipse at 90% 10%, rgba(232, 121, 76, 0.08), transparent 55%),
    var(--paper);
  min-height: 100vh;
}

.mono { font-family: 'JetBrains Mono', monospace; }

/* ───────── HERO BANNER ───────── */
.hero-band {
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #0a0c10 0%, #050608 100%);
}
.hero-band-art {
  position: absolute;
  inset: 0;
  background: none right -120px center/auto 380px no-repeat;
  opacity: 0.18;
  filter: grayscale(1) contrast(1.1);
  pointer-events: none;
}
.hero-band::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(168, 196, 230, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 196, 230, 0.045) 1px, transparent 1px);
  background-size: 36px 36px;
  -webkit-mask-image: radial-gradient(ellipse at left center, black 0%, transparent 85%);
          mask-image: radial-gradient(ellipse at left center, black 0%, transparent 85%);
  pointer-events: none;
}
.hero-inner {
  position: relative;
  z-index: 1;
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px 36px 24px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 28px;
}
.hero-overlay { display: flex; flex-direction: column; gap: 4px; }
.hero-overlay .kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--af-cyan);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.hero-overlay .htitle {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 56px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: #fff;
  text-transform: uppercase;
}
.hero-overlay .hsub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--af-silver-300);
  text-transform: uppercase;
  margin-top: 8px;
}
.hero-overlay .hsub b { color: var(--green); font-weight: 600; }

.hero-right {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  min-width: 560px;
}

/* Stats bar */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  background: rgba(11, 13, 17, 0.7);
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.stats-bar .stat-pill {
  padding: 10px 16px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stats-bar .stat-pill:last-child { border-right: none; }
.stat-pill .lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--af-silver-400);
  text-transform: uppercase;
}
.stat-pill .val {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.04em;
  color: #fff;
  text-transform: uppercase;
}
.stat-pill .val.live { color: var(--green); display: inline-flex; align-items: center; gap: 8px; }
.stat-pill .val.live::before {
  content: '';
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Spark Lab Team strip */
.team-strip {
  display: flex;
  align-items: stretch;
  background: rgba(11, 13, 17, 0.7);
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
  font-family: 'JetBrains Mono', monospace;
}
.team-strip .lead-tag {
  padding: 8px 14px;
  background: rgba(168, 196, 230, 0.08);
  border-right: 1px solid var(--line);
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--af-cyan);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  white-space: nowrap;
}
.team-strip .lead-tag::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--af-cyan);
  transform: rotate(45deg);
}
.team-strip .member {
  flex: 1;
  padding: 8px 14px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.team-strip .member:last-child { border-right: none; }
.team-strip .member .name {
  font-size: 11px;
  color: #fff;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.team-strip .member .role {
  font-size: 8.5px;
  color: var(--af-silver-400);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* Secondary topbar */
.topbar {
  border-bottom: 1px solid var(--line);
  background: rgba(11, 13, 17, 0.85);
}
.topbar-inner {
  max-width: 1480px;
  margin: 0 auto;
  padding: 12px 36px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.brand h1 {
  margin: 0;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.06em;
  color: #fff;
  text-transform: uppercase;
}
.brand .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--af-silver-400);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 2px;
}
.brand .sub b { color: var(--af-cyan); font-weight: 600; }
.topbar-right {
  margin-left: auto;
  display: flex;
  gap: 10px;
}
.topbar-right .stat-pill {
  border: 1px solid var(--line);
  padding: 7px 14px;
  border-radius: 3px;
  background: rgba(5, 6, 8, 0.5);
}
.topbar-right .stat-pill .val { font-size: 15px; }

/* ───────── PAGE WRAPPER ───────── */
.page {
  max-width: 1480px;
  margin: 0 auto;
  padding: 24px 36px 48px;
  position: relative;
}
.page::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(168, 196, 230, 0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 196, 230, 0.025) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: radial-gradient(ellipse at top, black 0%, transparent 80%);
          mask-image: radial-gradient(ellipse at top, black 0%, transparent 80%);
  pointer-events: none;
  z-index: 0;
}
.page > * { position: relative; z-index: 1; }

/* ───────── SECTION HEAD ───────── */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin: 28px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.section-head .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--af-cyan);
  letter-spacing: 0.22em;
}
.section-head h2 {
  margin: 0;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 26px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
}
.section-head .meta {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--af-silver-500);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* ───────── FILTER BAR ───────── */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.chip {
  background: rgba(11, 13, 17, 0.6);
  border: 1px solid var(--line);
  color: var(--af-silver-200);

.chip:hover {

/* ───────── CARD GRID ───────── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
@media (max-width: 1100px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .card { grid-column: span 1 !important; }
}
@media (max-width: 700px) {
  .card-grid { grid-template-columns: 1fr; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-right { min-width: 0; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .stats-bar .stat-pill:nth-child(2) { border-right: none; }
}

.card {
  grid-column: span 4;
  background: linear-gradient(180deg, rgba(28, 32, 39, 0.7) 0%, rgba(11, 13, 17, 0.92) 100%);
  border: 1px solid var(--line);
  border-radius: 3px;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: border-color 0.15s, transform 0.2s;
}
.card:hover { border-color: rgba(168, 196, 230, 0.4); transform: translateY(-2px); }
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  border-color: var(--af-cyan);
  border-style: solid;
  opacity: 0.55;
  pointer-events: none;
}
.card::before { top: 6px; left: 6px; border-width: 1px 0 0 1px; }
.card::after { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }
.card.priority { border-color: rgba(232, 121, 76, 0.45); }
.card.priority::before, .card.priority::after { border-color: var(--priority); opacity: 0.9; }

.card-head {
  padding: 16px 18px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.card-icon {
  width: 38px; height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  color: var(--af-cyan);
  background: rgba(5, 6, 8, 0.4);
  flex-shrink: 0;
}
.card.priority .card-icon { color: var(--priority); border-color: rgba(232, 121, 76, 0.4); }
.card-title-block { min-width: 0; flex: 1; }
.card-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--af-silver-500);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 19px;
  line-height: 1.1;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.card-sub {
  font-size: 11px;
  color: var(--af-silver-300);
  margin-top: 4px;
  line-height: 1.4;
}

.priority-tag, .status-tag {
  padding: 2px 7px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 0.18em;
  border-radius: 1px;
  text-transform: uppercase;
  white-space: nowrap;
}
.priority-tag { background: var(--priority); color: #fff; }
.status-tag.amber { background: rgba(232, 185, 74, 0.14); color: #f0d27a; border: 1px solid rgba(232, 185, 74, 0.4); }
.status-tag.blue { background: rgba(44, 74, 120, 0.22); color: var(--af-cyan); border: 1px solid rgba(168, 196, 230, 0.35); }
.status-tag.green { background: rgba(111, 180, 122, 0.14); color: #8fd29a; border: 1px solid rgba(111, 180, 122, 0.4); }

.card-body {
  padding: 14px 18px 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
}
.kv .k {
  font-size: 9px;
  color: var(--af-silver-500);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 2px;
  font-weight: 500;
}
.kv .v {
  font-family: 'JetBrains Mono', monospace;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
}
.kv .v.big { font-size: 22px; color: var(--af-cyan); font-weight: 600; letter-spacing: 0.02em; }
.kv .v.lg { font-size: 14px; color: #fff; }

.progress-block .lbl {
  display: flex; justify-content: space-between;
  font-size: 9px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--af-silver-500);

}
.progress-block .lbl .pct { font-family: 'JetBrains Mono', monospace; color: var(--af-silver-200); }
.progress {
  height: 5px;
  background: rgba(168, 196, 230, 0.1);
  overflow: hidden;
  position: relative;
  border-radius: 2px;
}
.progress > span {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: linear-gradient(90deg, var(--steel), var(--af-cyan));
}
.progress.priority > span { background: linear-gradient(90deg, #d65c34, var(--priority)); }
.progress.green > span { background: linear-gradient(90deg, #4d8b58, var(--green)); }

.card-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 6px;
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}
.card-list li {
  font-size: 11.5px;
  color: var(--af-silver-200);
  line-height: 1.45;
  display: flex; gap: 8px;
}
.card-list li::before {
  content: '';
  width: 5px; height: 5px;
  background: var(--af-cyan);
  margin-top: 6px;
  flex-shrink: 0;
  transform: rotate(45deg);
}
.card.priority .card-list li::before { background: var(--priority); }
.card-list li b { color: #fff; font-weight: 600; }

.card-foot {
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: rgba(5, 6, 8, 0.5);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--af-silver-400);

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;

}
.card-foot .lead b { color: #fff; font-weight: 600; }
.card-foot button {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--af-cyan);
  padding: 5px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  cursor: pointer;
  text-transform: uppercase;

}
.card-foot button:hover {
  background: var(--af-cyan);
  color: var(--ink-950);
  border-color: var(--af-cyan);
}

.change-banner {
  background: linear-gradient(90deg, rgba(232, 185, 74, 0.16), rgba(232, 185, 74, 0.04));
  border-left: 2px solid var(--amber);
  padding: 8px 12px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--af-silver-200);
}
.change-banner .label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  color: var(--amber);

  text-transform: uppercase;

  margin-bottom: 3px;
}
.change-banner s { color: var(--af-silver-500); text-decoration-thickness: 1px; }

.wearable-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.wear-tile {
  background: rgba(5, 6, 8, 0.55);
  border: 1px solid var(--line);
  padding: 8px 10px;
  border-radius: 2px;
}
.wear-tile.featured {
  border-color: rgba(168, 196, 230, 0.45);
  background: linear-gradient(180deg, rgba(44, 74, 120, 0.28), rgba(5, 6, 8, 0.55));
}
.wear-tile .name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 11.5px;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 5px;
}
.wear-tile .name .new {
  background: var(--amber);
  color: #0a172a;
  font-size: 8px;
  padding: 1px 4px;
  border-radius: 1px;
  letter-spacing: 0.1em;
  font-weight: 800;
}
.wear-tile .qty {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  color: var(--af-cyan);
  font-weight: 600;
  margin-top: 2px;
}
.wear-tile.featured .qty { color: var(--amber); }
.wear-tile .who {
  font-size: 9px;
  color: var(--af-silver-500);
  margin-top: 2px;
}

/* ───────── MISSION IMPACT ───────── */

}

.impact-card {

.impact-head .tag {

.roi-grid {

.roi-bar {

.roi-bar .b { text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }

.roi-bar .b .v {

.roi-bar .b .l {

  color: var(--af-silver-500);

.narrative {
  background: linear-gradient(180deg, rgba(28, 32, 39, 0.7) 0%, rgba(11, 13, 17, 0.92) 100%);

.priorities {

.priorities li {

/* ───────── TIMELINE ───────── */
.timeline {
  background: linear-gradient(180deg, rgba(28, 32, 39, 0.7) 0%, rgba(11, 13, 17, 0.92) 100%);
  border: 1px solid var(--line);
  padding: 18px 24px;
  margin-top: 18px;
}
.timeline-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 18px;
}
.timeline-head h3 {
  margin: 0;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
}
.timeline-track {
  position: relative;
  display: grid;
  grid-template-columns: repeat(6, 1fr);

}

.timeline-track::before {
  content: '';

.tl-month { position: relative; padding-top: 16px; }
.tl-month .m {

  margin: 0;
}
.vcard-progress .lbl {
  display: flex; justify-content: space-between;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--af-silver-500);
  margin-bottom: 4px;
}
.vcard-progress .lbl .pct { font-family: 'JetBrains Mono', monospace; color: var(--green); }
.vcard-progress .bar {
  position: relative;
  height: 5px;
  background: rgba(111, 180, 122, 0.1);
  border-radius: 2px;
  overflow: hidden;
}
.vcard-progress .bar > span:first-child {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: linear-gradient(90deg, #4d8b58, var(--green));
}
.vcard-progress .bar .max {
  position: absolute; top: -2px; bottom: -2px;
  width: 2px;
  background: rgba(255,255,255,0.6);
}
.vcard-meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  border-top: 1px dashed var(--line);
  padding-top: 8px;
}
.vcard-meta .m .l {
  font-size: 8px;
  color: var(--af-silver-500);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.vcard-meta .m .v {
  font-family: 'JetBrains Mono', monospace;
  color: #fff;
  font-size: 11px;
  font-weight: 500;
}
.vcard-meta .m.funded .v { color: var(--green); font-weight: 600; }

/* ───────── MODAL ───────── */
.detail-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 6, 8, 0.85);
  -webkit-backdrop-filter: blur(6px);
          backdrop-filter: blur(6px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 0.18s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.detail-modal {
  background: linear-gradient(180deg, #14171c 0%, #0b0d11 100%);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  display: flex; flex-direction: column;
  position: relative;
}
.detail-modal::before, .detail-modal::after {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  border-color: var(--af-cyan);
  border-style: solid;
  opacity: 0.7;
  pointer-events: none;
}
.detail-modal::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.detail-modal::after { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.detail-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex; gap: 14px; align-items: flex-start;
}
.detail-modal .close {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--af-silver-300);
  width: 32px; height: 32px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 2px;
  flex-shrink: 0;
}
.detail-modal .close:hover { color: #fff; border-color: var(--af-cyan); }
.detail-modal .body {
  padding: 18px 22px 22px;
  overflow-y: auto;
}
.detail-modal .body h4 {
  margin: 16px 0 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--af-cyan);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}
.detail-modal .body h4:first-child { margin-top: 0; }
.detail-modal .body p,
.detail-modal .body li {
  color: var(--af-silver-200);
  font-size: 13px;
  line-height: 1.55;
}
.detail-modal .body ul { padding-left: 18px; }

.pagefoot {
  margin-top: 32px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--af-silver-500);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  flex-wrap: wrap;
  gap: 8px;
}
.pagefoot .seal { color: var(--af-silver-200); font-weight: 600; }

.classif {
  background: #1f5b3a;
  color: #fff;
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.2em;
  padding: 4px 0;
  text-transform: uppercase;
}

</style>
